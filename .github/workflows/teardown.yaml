name: "Infrastructure Auto-Teardown"

on:
  workflow_dispatch: # Allows manual button click execution from GitHub actions tab

jobs:
  cleanup:
    name: "Purge AWS Resources"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Initialize Directory
        run: terraform -chdir=terraform/environment/prod init

      - name: Run Cleanup Script
        run: |
          chmod +x ./destroy.sh
          ./destroy.sh