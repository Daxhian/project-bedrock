apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retailstore-ingress
  namespace: default
  annotations:
    # This tells AWS to make a public-facing Application Load Balancer
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # This tells EKS exactly which controller should pick up this resource
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui
            port:
              number: 80