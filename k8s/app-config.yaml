apiVersion: v1
kind: ConfigMap
metadata:
  name: retailstore-config
  namespace: default
data:
  DB_NAME: "retailstore"
  CARTS_DYNAMODB_TABLE: "retailstore-carts"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retailstore-catalog-override
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-override
  template:
    metadata:
      labels:
        app: catalog-override
    spec:
      containers:
      - name: catalog-service
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://catalog-db:3306/retailstore"
        - name: SPRING_DATASOURCE_USERNAME
          value: "your_db_username"  # 👈 Replace with your actual username
        - name: SPRING_DATASOURCE_PASSWORD
          value: "your_db_password"  # 👈 Replace with your actual password
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service-override
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  selector:
    app: catalog-override
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: default
spec:
  type: ExternalName
  externalName: project-bedrock-cluster-mysql.cmnq2su0697b.us-east-1.rds.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-mysql
  namespace: default
spec:
  type: ExternalName
  externalName: project-bedrock-cluster-mysql.cmnq2su0697b.us-east-1.rds.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: default
spec:
  type: ExternalName
  externalName: project-bedrock-cluster-postgres.cmnq2su0697b.us-east-1.rds.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: orders-postgresql
  namespace: default
spec:
  type: ExternalName
  externalName: project-bedrock-cluster-postgres.cmnq2su0697b.us-east-1.rds.amazonaws.com