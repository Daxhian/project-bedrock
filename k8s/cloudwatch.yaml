apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
  labels:
    name: amazon-cloudwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudwatch-agent
  namespace: amazon-cloudwatch
  annotations:
    # Maps directly back to your irsa/outputs.tf value
    eks.amazonaws.com/role-arn: "arn:aws:iam::your-account-id:role/project-bedrock-cluster-cloudwatch-role" # 💡 Change account-id